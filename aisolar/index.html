<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta. Per-page title/description/OG/Twitter are owned by SEOHead
         (react-helmet) so there's exactly one of each — no duplicates. index.html
         keeps only the static fallback title + tags SEOHead does not set. -->
    <title>AISOLAR — The Solar Installer Operating System</title>
    <meta name="author" content="AISOLAR" />
    <meta name="theme-color" content="#26262B" />
    <meta property="og:site_name" content="AISOLAR" />
    <meta name="twitter:site" content="@aisolar_ie" />

    <!-- Fonts: Inter (primary) + JetBrains Mono (numerical/code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon (inline SVG, no external file needed) -->
    <!-- The AIOS tile: charcoal squircle, white wordmark (matches AiosMark) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8.3' fill='%2326262B'/%3E%3Ctext x='16' y='17' dominant-baseline='central' text-anchor='middle' fill='white' font-size='11' font-weight='700' letter-spacing='-0.2' font-family='Inter, system-ui, sans-serif'%3EAIOS%3C/text%3E%3C/svg%3E" />

    <!-- Entity foundation: Organization + WebSite (JSON-LD, @id cross-referenced) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://aisolar.ie/#organization",
          "name": "AISOLAR",
          "url": "https://aisolar.ie",
          "description": "The operating system for Irish solar installers. Reads the day/night split from an electricity bill; ten agents run survey scheduling, proposal drafting, SEAI grant tracking, install coordination and follow-ups.",
          "areaServed": { "@type": "Country", "name": "Ireland" },
          "parentOrganization": { "@type": "Organization", "name": "AIOS" }
        },
        {
          "@type": "WebSite",
          "@id": "https://aisolar.ie/#website",
          "url": "https://aisolar.ie",
          "name": "AISOLAR",
          "inLanguage": "en-IE",
          "publisher": { "@id": "https://aisolar.ie/#organization" }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
